name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kharcha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kharcha-apk
          path: Kharcha.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kharcha (latest build)
          body: "Download Kharcha.apk below and install it on your phone. Build ${{ github.run_number }} from ${{ github.sha }}."
          prerelease: false
          make_latest: true
          files: Kharcha.apk
