name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Expensify.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Expensify-apk
          path: Expensify.apk

      # The app used to ship as Kharcha.apk; drop that file so only the current build is offered
      - name: Remove old APK from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest Kharcha.apk -y --repo ${{ github.repository }} || true

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Expensify (latest build)
          body: "Download Expensify.apk below and install it on your phone. It installs over the old Kharcha app and keeps your data. Build ${{ github.run_number }} from ${{ github.sha }}."
          prerelease: false
          make_latest: true
          files: Expensify.apk
